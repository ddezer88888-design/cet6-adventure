/* 闪烁动画 */
@keyframes blink {
  0%, 50% { opacity: 1; }
  51%, 100% { opacity: 0.3; }
}

}

/* 浮动动画 */

  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(calc(-20 * var(--rpx))); }
}

  animation: float 3s ease-in-out infinite;

  0%, 100% { transform: translateX(0); }

  75% { transform: translateX(calc(10 * var(--rpx))); }

  0% { transform: scale(0); }
  80% { transform: scale(1.1); }
  100% { transform: scale(1); }
}

.pop {
  animation: pop 0.3s ease-out;

/* 淡入动画 */
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.fadeIn {
  animation: fadeIn 0.5s ease-in;

/* 从下方滑入 */
@keyframes slideUp {
  from { opacity: 0; transform: translateY(calc(60 * var(--rpx))); }
  to { opacity: 1; transform: translateY(0); }

<script type="text/template" id="tpl-pages/unit-select/unit-select"><!-- pages/unit-select/unit-select.wxml -->

    </div>

    <div data-block="1" wx:for="{{units}}" wx:key="unit" wx:for-item="unit">
      <div class="unit-card" style="border-color:{{unit.borderColor}};">
        <!-- 单元编号徽章 -->
        <div class="unit-badge" style="background-color:{{unit.borderColor}};">
          <span class="unit-badge-text" style="color:{{unit.badgeTextColor}};">CH {{unit.unit}}</span>
        </div>

        <!-- 像素画缩略图 -->
        <div class="unit-art-wrapper">
          <pixel-art art="{{unit.art}}" pixelSize="{{unit.pixelSize}}" ></pixel-art>
        </div>

        <!-- 单元标题 -->
        <div class="unit-title">{{unit.title}}</div>
        <div class="unit-subtitle">{{unit.subtitle}}</div>

        <!-- 进度条 -->
        <div class="progress-bar" wx:if="{{unit.hasProgress}}">
          <div data-block="1" wx:for="{{unit.progressBlocks}}" wx:key="index" wx:for-item="block">
            <div class="progress-block {{block.filled ? 'block-filled' : 'block-empty'}}" style="{{block.filled ? 'background-color:' + unit.borderColor + ';' : ''}}"></div>
          </div>

          </div>
          <div class="status-tag status-progress" wx:elif="{{unit.hasProgress}}" style="color:{{unit.borderColor}};">
            <span class="status-text">进行中 {{unit.currentLevel}}/{{unit.totalLevels}}</span>
          </div>
          <div class="status-tag status-new" wx:else>
            <span class="status-text">未开始</span>
          </div>
        </div>

        <div class="unit-buttons">
          <div class="unit-btn continue-btn" wx:if="{{unit.hasProgress}}" style="border-color:{{unit.borderColor}};color:{{unit.borderColor}};" bindtap="onContinue" data-unit="{{unit.unit}}" hover-class="btn-hover" hover-stay-time="100">
            <span>继续闯关</span>
          </div>
          <div class="unit-btn start-btn" wx:else style="background-color:{{unit.borderColor}};" bindtap="onStart" data-unit="{{unit.unit}}" hover-class="btn-hover" hover-stay-time="100">
            <span>开始闯关</span>
          </div>

<script type="text/template" id="tpl-pages/game/game"><!-- pages/game/game.wxml -->
<div class="pixel-container game-bg">

  <!-- 故事弹窗层 -->
  <div class="story-overlay" wx:if="{{showStory}}" catchtouchmove="preventMove">

      <div class="story-art">
        <pixel-art art="{{currentArt}}" pixelSize="14" ></pixel-art>

        </div>

      <div class="story-continue" wx:else>
        <div class="continue-btn" bindtap="closeStory">继续 ▶</div>
      </div>
    </div>
  </div>

  <!-- 顶部状态栏 -->
  <div class="top-bar">
    <div class="back-btn" bindtap="onBack">◀</div>
    <div class="hp-area">
      <div data-block="1" wx:for="{{hpDisplay}}" wx:key="index">
        <pixel-art art="{{item ? artData.heart : artData.heart_empty}}" pixelSize="5" ></pixel-art>
      </div>
    </div>
    <div class="score-area">
      <pixel-art art="{{artData.star}}" pixelSize="5" ></pixel-art>
      <span class="score-text">{{score}}</span>
    </div>
  </div>

  <!-- 关卡信息 -->
  <div class="level-info">
    <span class="level-text">{{chapterTitle}} · 第{{currentLevel + 1}}关</span>
    <div class="progress-bar">
      <div class="progress-fill" style="width:{{progressPercent}}%;"></div>
    </div>
    <span class="progress-text">{{currentLevel + 1}} / {{totalLevels}}</span>
  </div>

  <!-- 像素小人区域 -->
  <div class="hero-area">
    <pixel-art art="{{heroArt}}" pixelSize="12" ></pixel-art>
  </div>

  <!-- 题目区域 -->
  <div class="question-area fadeIn" wx:if="{{!showResult}}">
    <div class="question-label">选出正确的单词</div>
    <div class="meaning-box">
      <span class="meaning-text">{{currentQuestion.meaning}}</span>
    </div>
  </div>

  <!-- 选项区域 -->
  <div class="options-area" wx:if="{{!showResult && !showStory}}">
    <div 
      class="option-btn {{selectedOption === index ? (isCorrect ? 'correct' : 'wrong') : ''}} {{answered && index === correctIndex ? 'correct' : ''}}"
      wx:for="{{currentQuestion.options}}"
      wx:key="index"
      data-index="{{index}}"
      bindtap="onSelectAnswer"
    >
      <span class="option-letter">{{['A','B','C','D'][index]}}</span>
      <span class="option-text">{{item}}</span>
    </div>
  </div>

  <!-- 答题反馈 -->
  <div class="feedback-area pop" wx:if="{{showFeedback}}">
    <span class="feedback-text {{isCorrect ? 'text-green' : 'text-red'}}">
      {{isCorrect ? '✓ 正确！' : '✗ 错误！'}}
    </span>
    <span class="feedback-word" wx:if="{{!isCorrect}}">正确答案: {{currentQuestion.word}}</span>
    <span class="feedback-combo" wx:if="{{isCorrect && combo > 1}}">连击 x{{combo}}!</span>
  </div>

  <!-- 无限模式特有按钮 -->
  <div class="infinite-end-btn" wx:if="{{mode === 'infinite'}}">
    <div class="end-btn" bindtap="onEarlyEnd">
      <span>🏃 回家吃饭</span>
    </div>
  </div>

  <!-- 连击显示 -->
  <div class="combo-display" wx:if="{{combo >= 3}}">
    <span class="combo-text">{{combo}}连击!</span>
  </div>
</div>
</script>

<script>
'use strict';

// === Storage Cache (fallback when localStorage is unavailable) ===
var _storageCache = {};

// === Module System ===
var _modules = {};
var _moduleCache = {};
var _currentModuleDir = '';

function _resolvePath(path, baseDir) {
  if (path.indexOf('.') !== 0) return path.replace(/\.js$/, '');
  var parts = path.split('/');
  var baseParts = baseDir ? baseDir.split('/') : [];
  for (var i = 0; i < parts.length; i++) {
    if (parts[i] === '..') baseParts.pop();
    else if (parts[i] === '.') continue;
    else baseParts.push(parts[i]);
  }
  return baseParts.join('/').replace(/\.js$/, '');
}

function require(path) {
  path = _resolvePath(path, _currentModuleDir);
  if (_moduleCache[path]) return _moduleCache[path].exports;
  var module = { exports: {} };
  _moduleCache[path] = module;
  var prevDir = _currentModuleDir;
  _currentModuleDir = path.substring(0, path.lastIndexOf('/'));
  if (_modules[path]) _modules[path].call(module.exports, module, module.exports, require);
  _currentModuleDir = prevDir;
  return module.exports;
}

// === rpx handling ===
function _updateRpx() {
  var w = Math.min(window.innerWidth, 500);
  document.documentElement.style.setProperty('--rpx', (w / 750) + 'px');
}
window.addEventListener('resize', _updateRpx);
_updateRpx();

// === App/Page/Component ===
var _app = null;
var _pages = {};
var _currentPageName = '';
var _currentPage = null;
var _pageStack = [];

function App(config) {
  _app = config;
  _app.globalData = config.globalData || {};
  if (config.onLaunch) config.onLaunch.call(_app);
}
function getApp() { return _app; }
function Page(config) { _pages[_currentPageName] = config; }
function Component(config) { /* handled by runtime */ }

// === Pixel Art Renderer ===
function _renderPixelArt(art, pixelSize) {
  pixelSize = parseInt(pixelSize) || 8;
  if (!art || !art.length) return '';
  var PALETTE = require('utils/story').PALETTE;
  var w = (art[0] || '').length * pixelSize;
  var h = art.length * pixelSize;
  var html = '<div class="pixel-art-container" style="width:calc(' + w + ' * var(--rpx));height:calc(' + h + ' * var(--rpx));">';
  for (var row = 0; row < art.length; row++) {
    for (var col = 0; col < art[row].length; col++) {
      var ch = art[row][col];
      var color = PALETTE[ch] || 'transparent';
      html += '<div class="pixel-cell" style="background-color:' + color +
        ';width:calc(' + pixelSize + ' * var(--rpx));height:calc(' + pixelSize +
        ' * var(--rpx));left:calc(' + (col * pixelSize) + ' * var(--rpx));top:calc(' + (row * pixelSize) + ' * var(--rpx));"></div>';
    }
  }
  html += '</div>';
  return html;
}

// === Template Engine ===
function _getTemplate(name) {
  var el = document.getElementById('tpl-' + name);
  return el ? el.innerHTML : '';
}

function _evalExpr(expr, scope) {
  try {
    var keys = Object.keys(scope);
    var values = keys.map(function(k) { return scope[k]; });
    var fn = Function.apply(null, keys.concat(['return (' + expr + ')']));
    return fn.apply(null, values);
  } catch(e) { return undefined; }
}

function _interpolate(text, scope) {
  if (!text) return '';

    beats: [
      { level: 1, art: 'ice_tundra', text: '刺骨的寒风划过面颊，莱克斯踏入了冰封苔原。脚下的雪地发出嘎吱声，远处巨大的冰柱如同水晶森林。' },
      { level: 10, art: 'ice_tundra', text: '一堵巨大的冰墙挡住了去路，冰墙后隐约有光芒闪动。', choices: [
        { text: '用词语之力融化冰墙', flag: 'ch5_ice', value: 'melt' },
        { text: '寻找地下冰洞绕行', flag: 'ch5_ice', value: 'tunnel' }
      ]},
      { level: 20, art: 'ice_tundra', text: '冰墙融化后，眼前的景象令人惊叹——一座完全由冰构成的城市废墟，冰建筑中的词语在幽幽发光。' },
      { level: 30, art: 'treasure', text: '在冰城废墟的一角，莱克斯发现了一个被冻在冰块中的宝箱。', easterEgg: 'ch5_ice_chest' },
      { level: 40, art: 'ice_tundra', text: '冰巨人从沉睡中醒来，它的每一步都让大地震颤。"回答我的问题，否则永远留在这里。"' },
      { level: 50, art: 'ice_tundra', text: '冰巨人的问题一个比一个难，但莱克斯凭借收集的词语之力一一化解。冰巨人的表情从威胁变成了惊讶。' },
      { level: 60, art: 'ice_tundra', text: '"很久没有人类能回答这么多了，"冰巨人说道，它指引莱克斯前往苔原中心。' },
      { level: 70, art: 'ice_tundra', text: '苔原中心是一个巨大的冰湖，湖面下能看到无数发光的词语在游动。' },
      { level: 80, art: 'ice_tundra', text: '莱克斯用词语之力在冰湖上开辟了一条通道，脚下的冰层下，词语之鱼成群游过。' },
      { level: 90, art: 'ice_tundra', text: '冰湖中央有一座小岛，岛上有一棵结满冰晶的树。冰巨人说残页就在树中。' },
      { level: 100, art: 'lexicon', text: '冰晶树的树心中封存着第五片残页。当莱克斯触摸它时，整个苔原的冰都微微泛光，仿佛在致敬。' },
      { level: 110, art: 'volcano', text: '冰巨人指向南方，那里地平线上有一道红色的光柱——火山锻造场。冰与火之地仅一线之隔。' },
      { level: 120, art: 'hero_walk', text: '莱克斯告别了冰巨人，向南方的火焰走去。身后是冰封苔原，前方是灼热的地狱。' },
      { level: 130, art: 'volcano', text: '温度急剧上升，冰雪在脚下化为水。远处火山的轮廓越来越清晰，岩浆的红色映红了天空。' },
      { level: 140, art: 'volcano', text: '火山口冒出的浓烟中，莱克斯隐约看到了巨龙盘旋的身影。诺斯似乎在守护着什么。' }
    ]
  },
  {
    unit: 6,
    title: '火山锻造场',
    subtitle: 'The Volcanic Forge',
    art: 'volcano',
    intro: '火山锻造场是古代词语锻造师的工作场所。词语在这里被锻造、淬火、打磨，成为最坚韧的知识武器。但锻造场的主人——一个伪装成铁匠的龙族，有着不为人知的秘密。',
    beats: [
      { level: 1, art: 'volcano', text: '热浪如潮水般涌来，莱克斯站在火山锻造场的入口。岩浆从两侧的水渠中缓缓流过，空气中弥漫着硫磺和金属的气味。' },
      { level: 10, art: 'volcano', text: '一位满脸煤灰的老铁匠正在锻造一把发光的词语之剑。"年轻人，来帮忙打铁吗？"', choices: [
        { text: '帮铁匠锻造词语之剑', flag: 'ch6_forge', value: 'help' },
        { text: '婉拒并寻找残页', flag: 'ch6_forge', value: 'refuse' }
      ]},
      { level: 20, art: 'treasure', text: '在锻造场的一个角落，莱克斯发现了一个被熔岩环绕的宝箱，只有搭对词语才能架出一条路。', easterEgg: 'ch6_lava_chest' },
      { level: 30, art: 'volcano', text: '铁匠的锻造技术令人叹为观止，每个词语在他手中化为实体，如同锻造金属一般。莱克斯从中学到了很多。' },
      { level: 40, art: 'volcano', text: '锻造场深处有一座巨大的熔炉，火焰呈蓝白色。铁匠说这是词语之火，温度足以熔化一切虚伪。' },
      { level: 50, art: 'volcano', text: '莱克斯注意到铁匠的手臂上有龙鳞纹路，但他没有说什么，继续帮忙锻造。' },
      { level: 60, art: 'volcano', text: '"你知道吗，"铁匠突然开口，"词语和火焰一样——既能创造，也能毁灭。"' },
      { level: 70, art: 'volcano', text: '熔炉突然剧烈震动，铁匠的脸色一变。"它来了……"他的身体开始变形，龙鳞浮现。' },
      { level: 80, art: 'dragon', text: '铁匠的真身是一条年迈的龙——诺斯的后裔。它并没有攻击莱克斯，而是递出了残页。"拿走吧，这是我能做的最后一件好事。"' },
      { level: 90, art: 'volcano', text: '"诺斯并非天生邪恶，"龙说道，"它也曾是词典的守护者，直到词语的力量腐蚀了它的心智。小心，不要重蹈覆辙。"' },
      { level: 100, art: 'lexicon', text: '第六片残页散发着灼热的红光，与之前收集的残页产生了共鸣。莱克斯感受到了词典的力量在增强。' },
      { level: 110, art: 'dragon', text: '龙用最后的力量为莱克斯锻造了一件铠甲。"穿上它，它能抵御暗影沼泽的腐蚀之力。"' },
      { level: 120, art: 'shadow_marsh', text: '北方的天空变成了暗紫色，那是暗影沼泽的方向。莱克斯穿上了龙铠甲，感到一股温暖的力量在身上流转。' },
      { level: 130, art: 'hero_stand', text: '"六片残页，还有六片。"莱克斯望着暗紫色的天空，他知道前方将更加艰难。' },
      { level: 140, art: 'shadow_marsh', text: '暗影沼泽的轮廓在地平线上若隐若现，紫黑色的雾气弥漫其间，令人不寒而栗。' }
    ]
  },
  {
    unit: 7,
    title: '暗影沼泽',
    subtitle: 'The Shadow Marsh',
    art: 'shadow_marsh',
    intro: '暗影沼泽弥漫着腐蚀性的暗影之力。词语在这里会被吞噬、扭曲。只有光之词语能驱散黑暗，照亮前进的道路。',
    beats: [
      { level: 1, art: 'shadow_marsh', text: '紫黑色的雾气吞噬了视线，莱克斯踏入暗影沼泽。每一步都踩在不确定的地面上，词语在耳边变成了扭曲的低语。' },
      { level: 10, art: 'shadow_marsh', text: '前方出现了两条路：一条有微弱的光芒，一条完全黑暗。', choices: [
        { text: '追随光芒之路——用词语之力照亮', flag: 'ch7_light', value: 'light' },
        { text: '潜入黑暗之路——用龙铠甲抵御腐蚀', flag: 'ch7_light', value: 'dark' }
      ]},
      { level: 20, art: 'shadow_marsh', text: '暗影生物从雾中扑出，它们是词语被腐蚀后的产物。莱克斯用光之词语驱散了它们。' },
      { level: 30, art: 'treasure', text: '在一片暗影中，莱克斯发现了一个发光的物体——一个被封在暗影水晶中的宝箱。', easterEgg: 'ch7_shadow_chest' },
      { level: 40, art: 'shadow_marsh', text: '沼泽深处有一座破败的祭坛，上面刻着警告：暗影之主沉睡于此，切勿唤醒。' },
      { level: 50, art: 'shadow_marsh', text: '莱克斯小心翼翼地绕过祭坛，但地面的震动表明暗影之主已经感知到了入侵者。' },
      { level: 60, art: 'shadow_marsh', text: '暗影之主化为一团漆黑的雾气，它的声音如同千万个词语同时被扭曲。"光？你带着光来到我的领地？"' },
      { level: 70, art: 'shadow_marsh', text: '莱克斯的词语之力与暗影之主的腐蚀之力激烈碰撞，每一次正确回答都化为光剑刺入暗影。' },
      { level: 80, art: 'shadow_marsh', text: '暗影之主终于被驱散，但莱克斯知道它并未消亡。沼泽中的暗影退去，露出了一条通往地下的阶梯。' },
      { level: 90, art: 'shadow_marsh', text: '阶梯尽头是一个暗影水晶洞穴，第七片残页被暗影水晶包裹，发出微弱的金光。' },
      { level: 100, art: 'lexicon', text: '莱克斯用光之词语击碎了暗影水晶，第七片残页挣脱了暗影的束缚，光芒比之前更加璀璨。' },
      { level: 110, art: 'clockwork', text: '暗影退去后，东方的地平线上出现了一座高塔的轮廓，塔顶闪烁着金色的齿轮光芒——发条塔。' },
      { level: 120, art: 'clockwork', text: '发条塔的齿轮声越来越清晰，莱克斯能感受到塔中蕴含的精密力量，那是一种完全不同于词语之力的机械之力。' },
      { level: 130, art: 'hero_walk', text: '"过半了，"莱克斯轻声说。七片残页已经收入囊中，但最困难的挑战还在前方。' },
      { level: 140, art: 'clockwork', text: '发条塔的齿轮缓缓转动，每一次咬合都发出沉稳的金属声。莱克斯走向了塔的大门。' }
    ]
  },
  {
    unit: 8,
    title: '发条塔',
    subtitle: 'The Clockwork Tower',
    art: 'clockwork',
    intro: '发条塔是一座完全由齿轮和发条驱动的机械奇迹。塔中的每一层都是一个词语谜题，需要正确回答才能驱动齿轮升到上一层。塔中隐藏着一个时间机器的秘密。',
    beats: [
      { level: 1, art: 'clockwork', text: '莱克斯推开发条塔沉重的大门，齿轮的咬合声充斥耳膜。塔内墙壁上布满了精密的机械结构，每个齿轮上都刻着词语。' },
      { level: 10, art: 'clockwork', text: '第一层的齿轮谜题需要正确排列词语才能驱动升降梯。', choices: [
        { text: '优先解谜驱动升降梯', flag: 'ch8_solve', value: 'solve' },
        { text: '尝试攀爬齿轮外壁', flag: 'ch8_solve', value: 'climb' }
      ]},
      { level: 20, art: 'treasure', text: '在一个错位的齿轮间隙中，莱克斯发现了一个隐藏的房间，里面有一个古老的宝箱。', easterEgg: 'ch8_hidden_room' },
      { level: 30, art: 'clockwork', text: '塔中的机械守卫是一群发条人偶，它们用词语提问来测试访客。答对则放行，答错则触发防御机关。' },
      { level: 40, art: 'clockwork', text: '莱克斯来到塔的中层，这里有一个巨大的钟盘，指针倒转。时间在这里似乎有了不同的意义。' },
      { level: 50, art: 'clockwork', text: '钟盘中央有一扇门，门上刻着："时间是一切词语的母亲。"' },
      { level: 60, art: 'clockwork', text: '门后是一个球形的房间，无数齿轮在四面八方旋转。这是一个时间机械！莱克斯看到了过去的影像在齿轮间闪过。' },
      { level: 70, art: 'clockwork', text: '在时间机械中，莱克斯看到了混沌巨龙诺斯的过去——它曾经是至高词典最忠诚的守护者。' },
      { level: 80, art: 'clockwork', text: '"词语的力量太大了，"过去的诺斯说，"我必须控制它……"然后莱克斯看到诺斯被力量腐蚀的全过程。' },
      { level: 90, art: 'clockwork', text: '时间机械的中心有一个齿轮形状的容器，第八片残页就封在其中，随着齿轮缓缓旋转。' },
      { level: 100, art: 'lexicon', text: '莱克斯取出了第八片残页，时间机械随之停止。整个发条塔的齿轮不再转动，安静得如同从未运行过。' },
      { level: 110, art: 'astral_bridge', text: '塔顶的天文台打开，莱克斯看到了星空。一条由星光构成的桥梁从塔顶延伸向宇宙深处——星界之桥。' },
      { level: 120, art: 'astral_bridge', text: '"诺斯也曾走过这座桥，"莱克斯想着时间机械中看到的影像，"也许我能理解它。"' },
      { level: 130, art: 'hero_stand', text: '莱克斯踏上了星界之桥，脚下是无尽的星空，每一步都伴随着词语之力的回响。' },
      { level: 140, art: 'astral_bridge', text: '星界之桥的终点隐约可见——一座由镜面构成的迷宫在星光中闪烁，折射出无数个影像。' }
    ]
  },
  {
    unit: 9,
    title: '星界之桥',
    subtitle: 'The Astral Bridge',
    art: 'astral_bridge',
    intro: '星界之桥连接着凡界与星界，桥由无数词语的星光构成。只有心灵纯净、词语扎实的人才能在桥上行走而不坠落。',
    beats: [
      { level: 1, art: 'astral_bridge', text: '莱克斯踏上星界之桥，脚下的星光桥面随着每一步闪烁。无垠的星空在四面八方延伸，词语化成的星座在远方闪烁。' },
      { level: 10, art: 'astral_bridge', text: '桥分为了两条：一条笔直但狭窄，一条弯曲但宽敞。', choices: [
        { text: '走笔直窄桥——快速但危险', flag: 'ch9_bridge', value: 'fast' },
        { text: '走弯曲宽桥——缓慢但安全', flag: 'ch9_bridge', value: 'safe' }
      ]},
      { level: 20, art: 'treasure', text: '在桥的一个星光节点处，莱克斯发现了一个漂浮的星光宝箱。', easterEgg: 'ch9_star_chest' },
      { level: 30, art: 'astral_bridge', text: '星界的守护者——一位由星光构成的身影出现了。它没有说话，只是用词语测试莱克斯的决心。' },
      { level: 40, art: 'astral_bridge', text: '守护者满意后化为一道星光融入桥面。莱克斯感到脚下的桥更加坚实了。' },
      { level: 50, art: 'astral_bridge', text: '在桥的中段，莱克斯看到了一面巨大的星镜，映出了自己收集残页的整个旅程。' },
      { level: 60, art: 'astral_bridge', text: '星镜中还映出了诺斯的身影——巨龙正盘踞在桥的终点，等待着莱克斯的到来。' },
      { level: 70, art: 'astral_bridge', text: '莱克斯加速前行，星光在脚下化为流光。词语之力与星光共鸣，速度越来越快。' },
      { level: 80, art: 'astral_bridge', text: '桥的终点越来越近，莱克斯能感受到第九片残页的力量在召唤。' },
      { level: 90, art: 'astral_bridge', text: '在桥的最后一节，一段缺失的桥面挡住了去路。莱克斯需要用词语之力重新构建星光桥梁。' },
      { level: 100, art: 'lexicon', text: '桥面修复，莱克斯冲过终点。第九片残页悬浮在星界之桥尽头的星光中，散发着宇宙般深邃的光芒。' },
      { level: 110, art: 'mirror_maze', text: '星界之桥的终点连接着一座由无数镜面构成的迷宫。每一面镜子都映出不同的可能性。' },
      { level: 120, art: 'mirror_maze', text: '莱克斯在镜中看到了不同选择导致的不同的自己——有的更强大，有的更智慧，有的……已经堕落。' },
      { level: 130, art: 'hero_stand', text: '"九片残页，还差三片。"莱克斯深吸一口气，走进了镜面迷宫。' },
      { level: 140, art: 'mirror_maze', text: '镜面迷宫的入口在身后关闭，无数面镜子在莱克斯周围反射着光芒和词语的倒影。' }
    ]
  },
  {
    unit: 10,
    title: '镜面迷宫',
    subtitle: 'The Mirror Maze',
    art: 'mirror_maze',
    intro: '镜面迷宫中，每一面镜子都映出一个不同的自我。迷宫的核心是莱克斯自己的倒影——一个被词语力量诱惑而堕落的版本。',
    beats: [
      { level: 1, art: 'mirror_maze', text: '无数面镜子在莱克斯周围闪烁，每面镜子中的"莱克斯"都在做不同的事情。有的在战斗，有的在读书，有的在堕落。' },
      { level: 10, art: 'mirror_maze', text: '迷宫的岔路口每面镜子都映出不同的道路。', choices: [
        { text: '相信自己的直觉选择道路', flag: 'ch10_mirror', value: 'intuition' },
        { text: '观察镜子中自己的表情判断', flag: 'ch10_mirror', value: 'observe' }
      ]},
      { level: 20, art: 'treasure', text: '在一面破裂的镜子后面，莱克斯发现了一个被藏起来的宝箱。', easterEgg: 'ch10_mirror_chest' },
      { level: 30, art: 'mirror_maze', text: '镜子中的莱克斯们开始说话了，每个都说着不同的话，有的真，有的假。分辨真假成了最大的挑战。' },
      { level: 40, art: 'mirror_maze', text: '迷宫深处有一面比其他都大的镜子，镜中的莱克斯穿着黑色斗篷——那正是之前在浮空城塔中见过的黑斗篷人！' },
      { level: 50, art: 'mirror_maze', text: '"你以为我是谁？"镜中的黑斗篷莱克斯说，"我就是你。是那个被词语力量诱惑的你。"' },
      { level: 60, art: 'mirror_maze', text: '黑斗篷莱克斯从镜中走出，实力与莱克斯不相上下。这是一场与自己的战斗。' },
      { level: 70, art: 'mirror_maze', text: '每次答对词语，莱克斯的力量增强一分，黑斗篷莱克斯的力量就减弱一分。反之亦然。' },

}

function saveUnitProgress(unitNum, progress) {
  try {
    const key = 'cet6_unit_' + unitNum
    wx.setStorageSync(key, progress)
  } catch (e) {
    console.error('保存单元进度失败', e)
  }
}

function clearUnitProgress(unitNum) {
  try {
    const key = 'cet6_unit_' + unitNum
    wx.removeStorageSync(key)
  } catch (e) {
    console.error('清除单元进度失败', e)
  }
}

// 获取所有单元进度概览
function getAllUnitProgress() {
  const result = []
  for (let i = 1; i <= 12; i++) {
    const p = getUnitProgress(i)
    result.push({
      unit: i,
      hasProgress: p !== null,
      currentLevel: p ? p.currentLevel : 0,
      completed: p ? p.completed : false,
      score: p ? p.score : 0
    })
  }
  return result
}

// 获取已完成的单元列表
function getCompletedUnits() {
  const completed = []
  for (let i = 1; i <= 12; i++) {
    const p = getUnitProgress(i)
    if (p && p.completed) {
      completed.push(i)
    }
  }
  return completed
}

// 乱序数组
function shuffle(array) {
  const arr = array.slice()
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1))
    ;[arr[i], arr[j]] = [arr[j], arr[i]]
  }
  return arr
}

// 从词库中随机取N个干扰选项
function getDistractors(allWords, correctWord, count) {
  const pool = allWords.filter(w => w.word !== correctWord.word)
  const shuffled = shuffle(pool)
  return shuffled.slice(0, count)
}

// 生成一道题的4个选项
function generateQuestion(word, allWords) {
  const distractors = getDistractors(allWords, word, 3)
  const options = shuffle([word, ...distractors])
  return {
    word: word.word,
    meaning: word.meaning,
    options: options.map(o => o.word)
  }
}

  saveUnitProgress,
  clearUnitProgress,
  getAllUnitProgress,
  getCompletedUnits,
  shuffle,
  getDistractors,
  generateQuestion
}

  { border: '#4895ef', badgeText: '#0f0e17' },  // 2 水晶洞窟 - 蓝

  { border: '#90e0ef', badgeText: '#0f0e17' },  // 5 冰封苔原 - 冰蓝
  { border: '#e63946', badgeText: '#ffffff' },  // 6 火山锻造场 - 红
  { border: '#9d4edd', badgeText: '#ffffff' },  // 7 暗影沼泽 - 紫
  { border: '#f48c06', badgeText: '#0f0e17' },  // 8 发条塔 - 橙
  { border: '#a8dadc', badgeText: '#0f0e17' },  // 9 星界之桥 - 银
  { border: '#e07a5f', badgeText: '#0f0e17' },  // 10 镜面迷宫 - 赤陶
  { border: '#e94560', badgeText: '#ffffff' },  // 11 巨龙要塞 - 粉红
  { border: '#ffd700', badgeText: '#0f0e17' }   // 12 终焉汇聚 - 纯金
]

Page({
  data: {
    units: [],
    stars: [],
    completedCount: 0

  onLoad() {
    this.generateStars()
    this.loadUnits()

  onShow() {

    this.loadUnits()
  },

  generateStars() {
    const stars = []
    for (let i = 0; i < 30; i++) {
      stars.push({
        x: Math.random() * 100,
        y: Math.random() * 100,
        size: Math.random() < 0.7 ? 4 : 6,
        delay: Math.random() * 2
      })
    }
    this.setData({ stars })
  },

  loadUnits() {
    const progressList = getAllUnitProgress()
    let completedCount = 0

    const units = storyChapters.map((chapter, index) => {
      const p = progressList[index]
      const wordCount = wordData['unit_' + chapter.unit].words.length
      const colorConfig = UNIT_COLORS[index]

      if (p.completed) completedCount++

      // 生成10格进度条
      const progressPct = p.hasProgress ? Math.min(p.currentLevel / wordCount, 1) : 0
      const filledBlocks = Math.round(progressPct * 10)
      const progressBlocks = []
      for (let i = 0; i < 10; i++) {

        unit: chapter.unit,
        title: chapter.title,
        subtitle: chapter.subtitle,
        borderColor: colorConfig.border,
        badgeTextColor: colorConfig.badgeText,
        art: pixelArt[chapter.art] || [],
        pixelSize: 4,
        hasProgress: p.hasProgress,
        completed: p.completed,
        currentLevel: p.currentLevel,
        totalLevels: wordCount,
        progressBlocks: progressBlocks

  onContinue(e) {
    const unit = e.currentTarget.dataset.unit
    wx.navigateTo({
      url: '/pages/game/game?mode=unit&unit=' + unit + '&continue=true'
    })
  },

  // 重新开始（需确认）
  onRestart(e) {
    const unit = e.currentTarget.dataset.unit
    wx.showModal({
      title: '重新开始',
      content: '重新开始将清除当前章节的进度，确定继续吗？',
      confirmText: '重新开始',
      cancelText: '取消',
      confirmColor: '#e63946',
      success: (res) => {
        if (res.confirm) {
          clearUnitProgress(unit)
          wx.navigateTo({
            url: '/pages/game/game?mode=unit&unit=' + unit + '&continue=false'
          })
        }
      }
    })
  },

  goBack() {
    wx.navigateBack()
  }
})

};

<script>
(function () {
  var ctx = null, master = null, musicOn = true, started = false, timer = null;
  var nextTime = 0, step = 0, lastFb = '';
  var BPM = 108, STEP = 60 / BPM / 2;
  var N = {A3:220.00,B3:246.94,C3:130.81,D3:146.83,E3:164.81,F3:174.61,G3:196.00,C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392.00,A4:440.00,C5:523.25,D5:587.33,E5:659.25,F5:698.46,G5:783.99};
  var BARS = [
    {b:'A3', a:['A3','C4','E4','C4','A3','E4','C4','E4'], l:{0:'E5',2:'C5',4:'D5',5:'E5'}},
    {b:'F3', a:['F3','A3','C4','A3','F3','C4','A3','C4'], l:{0:'A4',2:'C5',4:'F5',5:'E5'}},
    {b:'C3', a:['C3','E3','G3','E3','C3','G3','E3','G3'], l:{0:'E5',2:'G5',4:'C5',5:'B4'}},
    {b:'G3', a:['G3','B3','D4','B3','G3','D4','B3','D4'], l:{0:'D5',2:'B4',4:'G4',5:'A4'}}
  ];

  function init() {
    if (ctx) return true;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;

    master = ctx.createGain();
    master.gain.value = 0.45;
    master.connect(ctx.destination);

    g.gain.setValueAtTime(0.0001, at);
    g.gain.linearRampToValueAtTime(vol, at + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    osc.connect(g); g.connect(master);
    osc.start(at); osc.stop(at + dur + 0.02);

    var bar = BARS[Math.floor((i / 8) % 4)], k = i % 8;

    tone(N[bar.a[k]], at, STEP * 0.85, 'triangle', 0.085);
    if (bar.l[k]) tone(N[bar.l[k]], at, STEP * 1.5, 'square', 0.045);
    if (k % 2 === 1) tone(1600, at, 0.03, 'square', 0.012);

  }

  function stopMusic() {
    if (timer) { clearInterval(timer); timer = null; }
    started = false;
    updateBtn();
  }

  function sfx(kind) {
    if (!musicOn || !init()) return;
    if (ctx.state === 'suspended') ctx.resume();
    var t = ctx.currentTime + 0.01;

      tone(N.C5, t, 0.14, 'triangle', 0.30); tone(N.E5, t + 0.10, 0.14, 'triangle', 0.30); tone(N.G5, t + 0.20, 0.24, 'triangle', 0.30);
    } else if (kind === 'wrong') {
      tone(N.E3, t, 0.18, 'square', 0.20); tone(N.C3, t + 0.16, 0.30, 'square', 0.20);
    } else if (kind === 'victory') {
      tone(N.C5, t, 0.12, 'triangle', 0.30); tone(N.E5, t + 0.10, 0.12, 'triangle', 0.30); tone(N.G5, t + 0.20, 0.12, 'triangle', 0.30); tone(N.C5 * 2, t + 0.30, 0.30, 'triangle', 0.30);
    } else {
      tone(N.C5 * 2, t, 0.05, 'square', 0.10);
    }
  }

  // 反馈音效：监听答题反馈区域文字变化
  function checkFeedback() {
    var el = document.querySelector('.feedback-area');
    var t = el ? (el.innerText || '').replace(/\s+/g, '') : '';
    if (!t) { lastFb = ''; return; }

      lastFb = t;
      if (t.indexOf('正确') >= 0) sfx('correct');
      else if (t.indexOf('错误') >= 0) sfx('wrong');
    }
  }
  setInterval(checkFeedback, 150);

  // 点击音效（选项按钮交给答题反馈音效）
  document.addEventListener('click', function (e) {
    if (e.target && e.target.closest && e.target.closest('.option-btn')) return;

  }, true);

  // 首次交互自动开音乐（浏览器要求用户手势）
  function firstTouch() { if (musicOn) startMusic(); }

  btn.id = 'cet6-music-btn';
  btn.style.cssText = 'position:fixed;left:10px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:99999;' +
    'display:flex;align-items:center;gap:6px;padding:8px 12px;background:#1a1a2e;color:#f4d35e;' +
    'border:3px solid #f4d35e;font:bold 13px/1 monospace;box-shadow:4px 4px 0 rgba(0,0,0,.6);cursor:pointer;';
  btn.textContent = '♪ 音乐开';

  btn.addEventListener('click', function (ev) {

    musicOn = !musicOn;
    if (musicOn) startMusic(); else stopMusic();
  });

})();
